# Loopback egress proxy. One instance per role (loopback-proxy-fixer, -verifier, -signer),
# each on that role's internal network only, so a role can never use another role's policy.
# entrypoint.sh appends the role's allow rules and the final "deny all".
http_port 3128

acl CONNECT method CONNECT
acl https_port port 443
# -n: match the requested name only, never a reverse-DNS (PTR) name of the destination.
acl github dstdomain -n "/etc/loopback-proxy/allow-github.txt"
acl github_api dstdomain -n "/etc/loopback-proxy/allow-github-api.txt"
acl model dstdomain -n "/etc/loopback-proxy/allow-model.txt"
acl registry dstdomain -n "/etc/loopback-proxy/allow-registry.txt"
# One file per line: squid 5.7 loads only the first quoted file of a single acl line.
acl allowlisted dstdomain -n "/etc/loopback-proxy/allow-github.txt"
acl allowlisted dstdomain -n "/etc/loopback-proxy/allow-model.txt"
acl allowlisted dstdomain -n "/etc/loopback-proxy/allow-registry.txt"
# IP literals (IPv4 dotted, or IPv6 in brackets) are never allowed, whatever they point at.
acl ip_literal dstdom_regex -n ^[0-9.]+$ ^\[.*\]$ ^[0-9a-fA-F:]+$
# Never: loopback, RFC 1918 LAN, CGNAT, link-local (incl. 169.254.169.254 metadata), multicast,
# reserved, and the IPv6 equivalents incl. 6to4/Teredo (IPv4-mapped addresses are matched by the IPv4 ranges; 64:ff9b::/96 is NOT listed: squid 5.7 then matches every IPv4 destination, and there is no NAT64 here). Checked on the resolved address.
acl blocked_dst dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.168.0.0/16 198.18.0.0/15 224.0.0.0/4 240.0.0.0/4
acl blocked_dst dst ::/128 ::1 2001::/32 2002::/16 fc00::/7 fe80::/10 fec0::/10 ff00::/8

# Order matters: method, port, IP literal and the name allowlist are checked BEFORE anything that
# needs DNS, so a name outside the allowlist is never resolved (no DNS side channel via the proxy).
http_access deny !CONNECT
http_access deny !https_port
http_access deny ip_literal
http_access deny !allowlisted
http_access deny blocked_dst

# No caching, no state on disk, logs to the container's stdout/stderr.
cache deny all
cache_mem 0 MB
pid_filename none
access_log stdio:/dev/stdout
cache_log stdio:/dev/stderr
coredump_dir /tmp
via off
forwarded_for delete
shutdown_lifetime 1 seconds
