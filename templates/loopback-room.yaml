# Loopback room template (implementation §5.3).
#
# UNVERIFIED: written from the Switch template documentation (version 1). It has not been
# applied to a real Switch installation yet (plan Q4, Phase 7 step 2). Whether `agents:` may
# reference the already-registered custom agent `loopback-gate` is unknown; if it may not,
# invite it with `!invite-agent @loopback-gate` after creating the room.
#
# Paste the contents of prompts/fixer.md and prompts/verifier.md into the two room documents
# below before applying, so the documents match the repository files byte for byte.
version: 1
params:
  bridge:
    type: bridge
    default: [$first]
  repo_dir:
    type: directory
    label: Local clone of the demo repository
    default: "{$agents_dir}/loopback-demo"
agents:
  - name: loopback-fixer
    display_name: Loopback Fixer
    provider: claude
    location: local
    directory: "{repo_dir}"
    addressing: owner-agents
    instructions: |
      Follow the "Loopback fixer" document in this room exactly.
  - name: loopback-verifier
    display_name: Loopback Verifier
    provider: claude            # use codex if Codex access is confirmed (plan Q5)
    location: local
    directory: "{repo_dir}-verify"
    addressing: owner-agents
    instructions: |
      Follow the "Loopback verifier" document in this room exactly.
room:
  name: loopback-maintainers
  description: >-
    AI-assisted bug fixing with commit-bound approvals. Agents can investigate
    and propose fixes; only the Loopback gatekeeper can authorize a merge after
    verifying the current PR revision, required CI, independent review and
    maintainer approval.
  bridge: "{bridge}"
  channel_type: channel_private
  agents: [loopback-fixer, loopback-verifier, loopback-gate]
  users: ["{$creator}"]
  docs:
    - name: Loopback fixer
      description: Rules for the fixer agent
      instructions: Read and follow on joining.
      content: "<paste prompts/fixer.md>"
    - name: Loopback verifier
      description: Rules for the verifier agent
      instructions: Read and follow on joining.
      content: "<paste prompts/verifier.md>"
kickoff: "@loopback-gate help"
