name: Feature Request
description: Suggest an idea or enhancement for Loopback.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please propose features that align with Loopback's mission of commit-bound, human-controlled code verification.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem? Please describe clearly.
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: security_considerations
    attributes:
      label: Security & Invariant Impact
      description: How does this change interact with the gatekeeper, maintainer approval, and isolation boundaries?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or workarounds you've considered.
