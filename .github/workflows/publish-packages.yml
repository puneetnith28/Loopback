name: "Publish Packages"

on:
  push:
    tags:
      - 'packages-v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run dry-run pack and validation only without publishing"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify & Publish to GitHub Packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@puneetnith28'

      - name: Install dependencies
        run: npm ci

      - name: Validate workspace manifests & version consistency
        run: npm run release:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run test suites
        run: npm test

      - name: Build TypeScript workspaces
        run: npm run build

      - name: Dry-run package tarballs
        run: |
          set -euo pipefail
          echo "=== Inspecting @puneetnith28/loopback-contracts ==="
          npm pack --dry-run --workspace packages/contracts
          echo "=== Inspecting @puneetnith28/loopback-console-contracts ==="
          npm pack --dry-run --workspace packages/console-contracts

      - name: Publish @puneetnith28/loopback-contracts
        if: ${{ !inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          npm publish --workspace packages/contracts

      - name: Publish @puneetnith28/loopback-console-contracts
        if: ${{ !inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          npm publish --workspace packages/console-contracts

